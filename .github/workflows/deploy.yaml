name: Deploy_wf

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/**
  pull_request_review:
    types: [submitted]
      
  workflow_dispatch:

jobs:
  build:
    name: Build 
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Set NAME variable
        id: set_name
        run: |
          if [ "${{ github.event.pull_request.base.ref || github.ref_name }}" = "dev" ]; then
            echo "NAME=develop" >> $GITHUB_ENV
          elif [ "${{ github.event.pull_request.base.ref || github.ref_name }}" = "staging" ]; then
            echo "NAME=pre" >> $GITHUB_ENV
          elif [ "${{ github.event.pull_request.base.ref || github.ref_name }}" = "main" ]; then
            echo "NAME=prod" >> $GITHUB_ENV
          else
            echo "NAME=" >> $GITHUB_ENV
          fi
      - name: Echo NAME
        run: echo "NAME is $NAME"
  deploy2:
      name: generate scripts 
      runs-on: ubuntu-latest
      needs: build
      if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
      steps:
        - name: Echo hello world
          run: echo "${{github.event.pull_request.base.ref}}  -- ${{github.event.pull_request.base.ref }}"

          

  
